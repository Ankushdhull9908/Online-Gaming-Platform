<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Finding Opponent</title>

    <link rel="stylesheet" href="RandomPlayerMatching.css">
    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
    <script src="RandomPlayerWaiting.js" type="module"></script>
</head>

<body>

    <!-- Background decorations -->

    <div class="cloud cloud-1">☁️</div>
    <div class="cloud cloud-2">☁️</div>

    <div class="star star-1">⭐</div>
    <div class="star star-2">✨</div>
    <div class="star star-3">🌟</div>

    <div class="bubble bubble-1"></div>
    <div class="bubble bubble-2"></div>


    <div class="page">

        <div class="match-card">

            <!-- Animated search area -->

            <div class="search-circle">

                <div class="circle circle-outer"></div>
                <div class="circle circle-middle"></div>

                <div class="game-icon">
                    🎲
                </div>

            </div>


            <!-- Badge -->

            <div class="badge">
                🌎 ONLINE MATCH
            </div>


            <!-- Heading -->

            <h1 id="mainHeading">
    Finding an 
    <span>Opponent!</span>
</h1>
<div id="countdownContainer" class="countdown-container">
    <div id="countdownNumber">3</div>
</div>


            <p class="description">
                We're looking for another player
                who is ready to roll the dice with you.
            </p>


            <!-- Searching animation -->

            <div class="searching-box">

                <div class="players">

                    <div class="player you" id="myprofile">
                        
                    </div>

                    <div class="versus">
                        VS
                    </div>

                    <div class="player opponent" id="opponentprofile">
                        ❓
                    </div>

                </div>


                <div class="search-text">

                    <strong id="searchingText">
                        Searching for a player
                    </strong>

                    <div class="dots">
                        <span></span>
                        <span></span>
                        <span></span>
                    </div>

                </div>

            </div>


            <!-- Bottom message -->

            <div class="tip">
                🎲 Hang tight! Your opponent is just a roll away!
            </div>

        </div>

    </div>

</body>

</html>
