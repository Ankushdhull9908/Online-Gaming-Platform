<!doctype html> 
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tic Tac Toe | Project 10</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="TicTacToe.css" />
  </head>
  <body class="bg-dark text-white">
    <div class="container text-center py-5">
      <h1 class="fw-bold mb-4">Tic-Tac-Toe</h1>

      <div
        class="game-container m-auto p-4 bg-secondary bg-opacity-25 rounded-4 shadow-lg"
        style="max-width: 400px"
      >
        <div class="row g-2" id="board">
          <div class="col-4">
            <button class="square btn btn-light w-100" data-index="0"></button>
          </div>
          <div class="col-4">
            <button class="square btn btn-light w-100" data-index="1"></button>
          </div>
          <div class="col-4">
            <button class="square btn btn-light w-100" data-index="2"></button>
          </div>

          <div class="col-4">
            <button class="square btn btn-light w-100" data-index="3"></button>
          </div>
          <div class="col-4">
            <button class="square btn btn-light w-100" data-index="4"></button>
          </div>
          <div class="col-4">
            <button class="square btn btn-light w-100" data-index="5"></button>
          </div>

          <div class="col-4">
            <button class="square btn btn-light w-100" data-index="6"></button>
          </div>
          <div class="col-4">
            <button class="square btn btn-light w-100" data-index="7"></button>
          </div>
          <div class="col-4">
            <button class="square btn btn-light w-100" data-index="8"></button>
          </div>
        </div>

        <h3 id="status" class="mt-4 fs-5">Next player is X</h3>
        <button id="restartBtn" class="btn btn-danger fw-bold px-4 mt-2">
          Restart Game
        </button>
      </div>
    </div>

    <script src="TicTacToe.js"></script>
  </body>
</html>
