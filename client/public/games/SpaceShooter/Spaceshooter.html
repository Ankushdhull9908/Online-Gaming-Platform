<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galactic Defender | Gaming Zone</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome --> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="/Pages/SpaceShooter/SpaceShooter.css">
</head>
<body class=" overflow-hidden">

   <!-- HUD: Heads-Up Display -->
<!-- HUD: Heads-Up Display -->
<div class="position-absolute top-0 start-0 w-100 p-4 z-3 d-flex justify-content-between align-items-center pointer-none">
    
    
    <div class="d-flex gap-3 align-items-center">
        <!-- Control Buttons Group -->
        <div class="pointer-all d-flex gap-2">
            <button id="pauseBtn" class="btn btn-outline-warning btn-lg fw-bold d-none" onclick="togglePause()">
                <i class="fa-solid fa-pause"></i>
            </button>
            <button id="restartBtn" class="btn btn-outline-info btn-lg fw-bold d-none" onclick="confirmRestart()">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>

        <!-- Stats Boxes -->
        <div class="stats-box bg-dark bg-opacity-50 border border-info p-3 rounded-3 shadow pointer-none">
            <h5 class="text-info mb-0 fw-bold">SCORE: <span id="score" class="text-white">0</span></h5>
        </div>
        <div class="stats-box bg-dark bg-opacity-50 border border-danger p-3 rounded-3 shadow pointer-none">
            <h5 class="text-danger mb-0 fw-bold">LIVES: <span id="lives" class="text-white">3</span></h5>
        </div>
    </div>
</div>

<!-- Start Screen -->
<div id="startScreen" class="position-absolute top-50 start-50 translate-middle text-center z-3">
    <div class="card bg-dark bg-opacity-75 border-info p-5 shadow-lg" style="min-width: 300px;">
        <h1 class="display-4 fw-bold text-info mb-4">GALACTIC DEFENDER</h1>
        <button class="btn btn-info btn-lg px-5 py-3 fw-bold text-white shadow" onclick="startGame()">
            <i class="fa-solid fa-play me-2"></i>START MISSION
        </button>
    </div>
</div>
<div id="pauseScreen" class="position-absolute top-50 start-50 translate-middle text-center z-3 d-none">
    <div class="card bg-dark bg-opacity-75 border-warning p-5 shadow-lg">
        <h1 class="display-3 fw-bold text-warning mb-4">PAUSED</h1>
        <button class="btn btn-warning btn-lg px-5 py-3 fw-bold text-dark shadow" onclick="togglePause()">
            <i class="fa-solid fa-play me-2"></i>RESUME
        </button>
    </div>
</div>

<!-- Game Over Screen -->
 <!-- Inside your gameOverScreen div -->
<div id="gameOverScreen" class="position-absolute top-50 start-50 translate-middle text-center z-3 d-none">
    <div class="card bg-dark bg-opacity-75 border-danger p-5 shadow-lg">
        <h1 class="display-2 fw-bold text-danger mb-4">MISSION FAILED</h1>
        <p class="text-white mb-4 fs-4">Final Score: <span id="finalScore">0</span></p>
        
        <!-- This button refreshes the page to restart everything -->
       <button class="btn btn-outline-info btn-lg px-5 py-3 fw-bold shadow" onclick="resetGame()">
    <i class="fa-solid fa-rotate-right me-2"></i>PLAY AGAIN
</button>
    </div>
</div>
<div id="gameOverScreen" class="position-absolute top-50 start-50 translate-middle text-center z-3 d-none">
    <!-- ... same as your previous code ... -->
</div>
    <!-- The Game Canvas -->
    <canvas id="gameCanvas"></canvas>

    <script src="/Pages/SpaceShooter/SpaceShooter.js"></script>
</body>
</html>
