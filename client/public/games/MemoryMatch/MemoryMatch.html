<!doctype html> 
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Memory Match | Gaming Zone</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"
    />
    <link rel="stylesheet" href="/Pages/Memory Match/MemoryMatch.css"/>
  </head>
  <body class="bg-dark text-white">
    

    <div class="container">
      <div class="row justify-content-center">
        <div class="col-lg-6 col-md-8 text-center">
          <h1 class="display-4 fw-bold text-info text-black mb-2">MEMORY MATCH</h1>
          <p class="text-body-secondary mb-4">
            Find all pairs in the fewest moves possible!
          </p>

          <div class="card bg-secondary bg-opacity-25 border-info mb-4 shadow">
            <div
              class="card-body d-flex justify-content-around align-items-center"
            >
              <div>
                <span class=" small d-block">MOVES</span>
                <span id="moveCount" class="fs-3 fw-bold text-info">0</span>
              </div>
              <div class="vr bg-info"></div>
              <div>
                <span class=" small d-block">MATCHED</span>
                <span id="matchCount" class="fs-3 fw-bold text-info">0/8</span>
              </div>
            </div>
          </div>

          <div class="row g-3 justify-content-center" id="gameBoard"></div>

          <div class="mt-5">
            <button
              class="btn mb-5 btn-info btn-lg px-5 fw-bold text-white shadow"
              onclick="initGame()"
            >
              <i class="fa-solid fa-rotate-right me-2"></i> RESTART GAME
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/Pages/Memory Match/MemoryMatch.js"></script>
  </body>
</html>
